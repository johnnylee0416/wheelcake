<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>購物車結帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink:     #1a1a1a;
  --ink-2:   #3a3a3a;
  --ink-3:   #6b6b6b;
  --ink-4:   #a0a0a0;
  --surface: #f5f4f1;
  --white:   #ffffff;
  --border:  rgba(0,0,0,0.09);
  --border2: rgba(0,0,0,0.15);
  --glass:   rgba(255,255,255,0.60);
  --blur:    blur(16px);
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family:'Noto Sans TC',sans-serif;
  background:var(--surface);
  color:var(--ink);
  width:100vw; height:100vh;
  overflow:hidden;
  display:grid;
  grid-template-rows:auto 1fr auto;
}
#bg-video {
  position:fixed; inset:0;
  width:100%; height:100%;
  object-fit:cover;
  z-index:0;
  opacity:0.50;
  filter:grayscale(100%) contrast(1.1);
}
.overlay {
  position:fixed; inset:0; z-index:1;
  background:
    radial-gradient(ellipse 70% 60% at 30% 50%, rgba(200,200,195,0.14) 0%, transparent 65%),
    linear-gradient(160deg, rgba(245,244,241,0.10) 0%, rgba(245,244,241,0.55) 100%);
  pointer-events:none;
}
header {
  position:relative; z-index:10;
  padding:18px 44px;
  display:flex; align-items:center; gap:20px;
  border-bottom:1px solid var(--border);
  background:rgba(245,244,241,0.75);
  backdrop-filter:var(--blur);
  -webkit-backdrop-filter:var(--blur);
}
.back-btn {
  display:flex; align-items:center; justify-content:center;
  width:36px; height:36px;
  border-radius:50%;
  border:1px solid var(--border2);
  background:var(--glass);
  backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  cursor:pointer; text-decoration:none; color:var(--ink); flex-shrink:0;
  transition:background 0.2s, transform 0.2s;
}
.back-btn:hover { background:rgba(255,255,255,0.9); transform:translateX(-2px); }
.back-btn svg { width:15px; height:15px; stroke:var(--ink); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.header-title { flex:1; display:flex; flex-direction:column; gap:2px; }
.header-title-main { font-family:'Playfair Display',serif; font-size:17px; font-weight:700; color:var(--ink); }
.header-title-sub { font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:var(--ink-4); }
.header-meta { display:flex; align-items:baseline; gap:5px; margin-right:4px; }
.header-meta-count { font-family:'Playfair Display',serif; font-size:22px; font-weight:700; color:var(--ink); }
.header-meta-label { font-size:12px; color:var(--ink-4); }
.hbtn {
  padding:9px 22px; border-radius:50px;
  border:1px solid var(--border2);
  background:var(--glass);
  backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  color:var(--ink-2); font-size:13px; font-weight:500;
  font-family:inherit; cursor:pointer;
  transition:background 0.2s, transform 0.15s;
  letter-spacing:0.03em;
}
.hbtn:hover:not(:disabled) { background:rgba(255,255,255,0.9); transform:translateY(-1px); }
.hbtn:disabled { opacity:0.35; cursor:not-allowed; }
.hbtn-primary {
  background:var(--ink); border-color:var(--ink);
  color:var(--white); font-weight:700;
  box-shadow:0 3px 14px rgba(0,0,0,0.18);
}
.hbtn-primary:hover:not(:disabled) {
  background:var(--ink-2); border-color:var(--ink-2);
  color:var(--white); box-shadow:0 5px 20px rgba(0,0,0,0.22);
}
#success-msg {
  position:fixed; top:76px; left:50%;
  transform:translateX(-50%) translateY(-8px);
  background:rgba(255,255,255,0.95);
  border:1px solid rgba(0,0,0,0.10);
  backdrop-filter:var(--blur); color:var(--ink);
  padding:12px 32px; border-radius:50px;
  font-size:14px; font-weight:600;
  opacity:0; transition:opacity 0.4s, transform 0.4s;
  pointer-events:none; z-index:50; white-space:nowrap;
  box-shadow:0 4px 20px rgba(0,0,0,0.08);
}
#success-msg.show { opacity:1; transform:translateX(-50%) translateY(0); }
.canvas-wrap { position:relative; z-index:2; overflow:hidden; }
canvas { display:block; width:100%!important; height:100%!important; }
.canvas-wrap::after {
  content:'';
  position:absolute; bottom:0; left:0; right:0; height:60px;
  background:linear-gradient(to top, rgba(245,244,241,0.20), transparent);
  pointer-events:none; z-index:3;
}
.bottom-bar {
  position:relative; z-index:10;
  border-top:1px solid var(--border);
  padding:14px 44px;
  display:flex; align-items:center; gap:10px;
  overflow-x:auto;
  background:rgba(245,244,241,0.82);
  backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
}
.bottom-bar::-webkit-scrollbar { height:0; }
.item-chip {
  flex-shrink:0;
  display:flex; align-items:center; gap:7px;
  background:var(--white);
  border:1px solid var(--border2);
  border-radius:50px;
  padding:6px 14px 6px 10px;
  font-size:13px; font-weight:500;
  color:var(--ink-2); white-space:nowrap;
  box-shadow:0 1px 4px rgba(0,0,0,0.04);
}
.item-chip-icon { font-size:17px; }
.item-chip-qty {
  background:var(--ink-2); color:var(--white);
  font-size:10px; font-weight:700;
  min-width:18px; height:18px; border-radius:50px;
  display:flex; align-items:center; justify-content:center; padding:0 4px;
}
.bar-spacer { flex:1; }
.bar-total {
  flex-shrink:0;
  display:flex; align-items:baseline; gap:5px;
  padding-left:20px;
  border-left:1px solid var(--border2);
}
.bar-total-label { font-size:10px; font-weight:400; font-family:'Noto Sans TC',sans-serif; color:var(--ink-4); letter-spacing:0.1em; }
.bar-total-num { font-family:'Playfair Display',serif; font-size:24px; font-weight:700; color:var(--ink); white-space:nowrap; }
.modal-backdrop {
  position:fixed; inset:0; z-index:100;
  background:rgba(0,0,0,0.35);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity 0.25s;
}
.modal-backdrop.open { opacity:1; pointer-events:all; }
.modal-card {
  background:var(--white); border-radius:20px;
  padding:36px 34px; width:320px;
  box-shadow:0 20px 60px rgba(0,0,0,0.16);
  transform:translateY(12px) scale(0.97);
  transition:transform 0.25s;
}
.modal-backdrop.open .modal-card { transform:translateY(0) scale(1); }
.modal-title { font-family:'Playfair Display',serif; font-size:19px; font-weight:700; margin-bottom:5px; }
.modal-sub { font-size:12px; color:var(--ink-4); margin-bottom:24px; }
.modal-label { font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:var(--ink-4); display:block; margin-bottom:7px; }
.modal-input {
  width:100%; padding:12px 14px; border-radius:10px;
  border:1.5px solid rgba(0,0,0,0.11); background:var(--surface);
  font-family:inherit; font-size:15px; color:var(--ink);
  transition:border-color 0.2s; outline:none;
}
.modal-input:focus { border-color:var(--ink-3); }
.modal-input.shake { animation:shake 0.35s ease; border-color:#c00; }
@keyframes shake { 0%,100%{ transform:translateX(0); } 25%{ transform:translateX(-6px); } 75%{ transform:translateX(6px); } }
.modal-btns { display:flex; gap:10px; margin-top:20px; }
.modal-cancel {
  flex:1; padding:12px; border-radius:10px;
  border:1px solid rgba(0,0,0,0.11); background:transparent;
  font-family:inherit; font-size:13px; color:var(--ink-3); cursor:pointer;
  transition:background 0.15s;
}
.modal-cancel:hover { background:var(--surface); }
.modal-confirm {
  flex:2; padding:12px; border-radius:10px; border:none;
  background:var(--ink); color:var(--white);
  font-family:inherit; font-size:13px; font-weight:700; cursor:pointer;
  box-shadow:0 3px 12px rgba(0,0,0,0.14);
  transition:background 0.15s, transform 0.15s;
}
.modal-confirm:hover { background:var(--ink-2); transform:translateY(-1px); }
/* ── 音樂播放器 ── */
.music-btn {
  position:fixed; bottom:28px; right:28px; z-index:200;
  width:46px; height:46px; border-radius:50%;
  border:1px solid rgba(0,0,0,0.14);
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  box-shadow:0 4px 18px rgba(0,0,0,0.12);
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:background 0.2s, transform 0.2s;
  font-size:18px; color:var(--ink);
}
.music-btn:hover { background:rgba(255,255,255,0.95); transform:scale(1.08); }
.music-btn.playing { background:var(--ink); color:#fff; }
.music-label {
  position:fixed; bottom:32px; right:82px; z-index:200;
  background:rgba(255,255,255,0.80);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(0,0,0,0.10);
  border-radius:50px; padding:7px 14px;
  font-size:11px; color:var(--ink-3); letter-spacing:0.06em;
  pointer-events:none; opacity:0;
  transition:opacity 0.3s; white-space:nowrap;
  box-shadow:0 2px 12px rgba(0,0,0,0.08);
}
.music-label.show { opacity:1; }

/* ════════════════════════════════════
   RWD — 只加斷點，不改原有樣式
   ════════════════════════════════════ */

/* 平板（768px 以下） */
@media (max-width: 768px) {
  body {
    height: auto;
    min-height: 100vh;
    overflow: auto;
  }

  .canvas-wrap {
    height: 55vw;
    min-height: 280px;
    max-height: 440px;
  }

  .bottom-bar {
    padding: 12px 20px;
    flex-wrap: wrap;
    gap: 8px 10px;
    overflow-x: visible;
  }

  .bar-spacer { display: none; }

  .bar-total {
    width: 100%;
    border-left: none;
    padding-left: 0;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }

  header { padding: 14px 20px; }

  /* 音樂按鈕在平板往上移，避免壓到合計 */
  .music-btn  { bottom: auto; top: 80px; }
  .music-label { bottom: auto; top: 84px; }
}

/* 手機（480px 以下） */
@media (max-width: 480px) {
  .canvas-wrap {
    height: 70vw;
    max-height: none;
  }

  .header-title-sub { display: none; }
  .header-meta { display: none; }

  .hbtn { padding: 9px 16px; font-size: 12px; }

  .modal-card {
    width: calc(100vw - 40px);
    padding: 28px 24px;
  }

  .bottom-bar { padding: 10px 16px; }

  .item-chip { font-size: 12px; padding: 5px 10px 5px 8px; }
}
</style>

<script type="module">
// ── Firebase ──
import { initializeApp }   from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, Timestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ── Three.js ──
import * as THREE from 'three';
import { GLTFLoader }    from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── Firebase 初始化 ── */
const firebaseConfig = {
  apiKey:            "AIzaSyD1WeeJoIxdGz9lOpk9zBGIr4jR50OLREs",
  authDomain:        "hailua-orders.firebaseapp.com",
  projectId:         "hailua-orders",
  storageBucket:     "hailua-orders.firebasestorage.app",
  messagingSenderId: "747213229698",
  appId:             "1:747213229698:web:678e8eb1757c2fd30eae9b",
};
const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

const CART_MODEL_URL = './cart.glb';

let cartItems = [];
try { cartItems = JSON.parse(localStorage.getItem('cartItems') || '[]'); } catch(e) {}
if (!cartItems.length) {
  cartItems = [
    { id:'p1', name:'大腸麵線', price:60,  qty:1, emoji:'🍜', modelUrl:'big.glb',      scale:1.4 },
    { id:'p3', name:'奶油',     price:50,  qty:2, emoji:'🧈', modelUrl:'keyboard.glb', scale:4.0 },
    { id:'p5', name:'巧克力',   price:65,  qty:1, emoji:'🍫', modelUrl:'watch.glb',    scale:4.0 },
  ];
}

function renderHeaderMeta() {
  const el    = document.getElementById('header-meta');
  const count = cartItems.reduce((s, i) => s + i.qty, 0);
  el.innerHTML = `<span class="header-meta-count">${count}</span><span class="header-meta-label">件商品</span>`;
}
renderHeaderMeta();

function renderItemBar() {
  const bar = document.getElementById('item-bar');
  if (!cartItems.length) return;
  const total = cartItems.reduce((s, i) => s + i.price * i.qty, 0);
  bar.innerHTML =
    cartItems.map(item => `
      <div class="item-chip">
        <span class="item-chip-icon">${item.emoji}</span>
        <span>${item.name}</span>
        <span class="item-chip-qty">×${item.qty}</span>
      </div>
    `).join('') +
    `<div class="bar-spacer"></div>
     <div class="bar-total">
       <span class="bar-total-label">合計</span>
       <span class="bar-total-num">NT$&nbsp;${total.toLocaleString()}</span>
     </div>`;
}
renderItemBar();

/* ── Modal ── */
const modal       = document.getElementById('modal');
const nameInput   = document.getElementById('name-input');
const btnCheckout = document.getElementById('btn-checkout');

btnCheckout.addEventListener('click', () => {
  if (animRunning) return;
  nameInput.value = '';
  modal.classList.add('open');
  setTimeout(() => nameInput.focus(), 260);
});
document.getElementById('modal-cancel').addEventListener('click', () => modal.classList.remove('open'));
modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });
nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('modal-confirm').click(); });
document.getElementById('modal-confirm').addEventListener('click', () => {
  const name = nameInput.value.trim();
  if (!name) {
    nameInput.classList.add('shake');
    nameInput.addEventListener('animationend', () => nameInput.classList.remove('shake'), { once: true });
    nameInput.focus();
    return;
  }
  modal.classList.remove('open');
  doCheckout(name);
});

/* ── Three.js ── */
const canvas = document.getElementById('c');
const wrap   = document.getElementById('canvas-wrap');

const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled   = true;
renderer.shadowMap.type      = THREE.PCFSoftShadowMap;
renderer.outputColorSpace    = THREE.SRGBColorSpace;
renderer.toneMapping         = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.setClearColor(0x000000, 0);

function resize() {
  renderer.setSize(wrap.clientWidth, wrap.clientHeight);
  camera.aspect = wrap.clientWidth / wrap.clientHeight;
  camera.updateProjectionMatrix();
}

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.001, 1000);
camera.position.set(0, 4.5, -4.5);
camera.lookAt(0, 0.8, 0);

const controls = new OrbitControls(camera, canvas);
controls.enableRotate  = false;
controls.enableZoom    = false;
controls.enablePan     = false;
controls.enableDamping = false;
controls.target.set(0, 0.8, 0);
controls.update();

scene.add(new THREE.AmbientLight(0xffffff, 1.0));
const sun = new THREE.DirectionalLight(0xffffff, 2.0);
sun.position.set(5, 10, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = sun.shadow.camera.bottom = -6;
sun.shadow.camera.right = sun.shadow.camera.top   =  6;
sun.shadow.bias = -0.001;
scene.add(sun);
const fillL = new THREE.DirectionalLight(0xe8e8e8, 0.5);
fillL.position.set(-4, 3, -3); scene.add(fillL);
const rimL = new THREE.DirectionalLight(0xd8d8d8, 0.3);
rimL.position.set(0, -2, 4); scene.add(rimL);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.MeshStandardMaterial({ color:0xeeecea, roughness:0.95 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const ITEM_COLORS = [0x9ca3af, 0x6b7280, 0xd1d5db, 0x4b5563, 0xe5e7eb, 0x374151];
const itemLoader  = new GLTFLoader();
const itemGroups  = [];

function dropIn(group, initWorldPos, delayMs) {
  const DROP_HEIGHT = 3.0, DURATION = 600;
  group.position.set(initWorldPos.x, initWorldPos.y + DROP_HEIGHT, initWorldPos.z);
  setTimeout(() => {
    const t0 = performance.now();
    function fall(now) {
      const p = Math.min((now - t0) / DURATION, 1);
      const e = 1 - Math.pow(1 - p, 3);
      group.position.y = initWorldPos.y + DROP_HEIGHT * (1 - e);
      if (p < 1) requestAnimationFrame(fall);
      else group.position.y = initWorldPos.y;
    }
    requestAnimationFrame(fall);
  }, delayMs);
}

function placeItems(cartModel) {
  const BASKET_Y = 0.18;
  const BW = 0.25, BH = 0.42, BD = 0.25;
  const slots = [
    [2.6,  -3.0],[2.15,-3.0],[1.72,-3.0],
    [2.45, -3.8],[1.95,-3.8],[1.5, -3.8],
    [2.45, -4.5],[2.1, -4.5],[1.1, -6.0],
  ];
  const slotStackH = {}, tasks = [];
  let si = 0;
  cartItems.forEach((item, ci) => {
    const sk = si % slots.length;
    const [lx, lz] = slots[sk]; si++;
    for (let q = 0; q < item.qty; q++) {
      const stackH = slotStackH[sk] || 0;
      slotStackH[sk] = stackH + BH - 0.25;
      tasks.push({ item, ci, lx, ly: BASKET_Y + stackH, lz, BW, BH, BD });
    }
  });
  tasks.forEach(({ item, ci, lx, ly, lz, BW, BH, BD }, idx) => {
    const addToScene = (obj) => {
      const group = new THREE.Group();
      group.add(obj); scene.add(group);
      const initWorldPos = new THREE.Vector3(lx, ly, lz).applyMatrix4(cartModel.matrixWorld);
      dropIn(group, initWorldPos, idx * 120);
      itemGroups.push({ group, initWorldPos });
    };
    if (item.modelUrl) {
      itemLoader.load(item.modelUrl, (gltf) => {
        const m = gltf.scene;
        const box    = new THREE.Box3().setFromObject(m);
        const size   = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const itemScale = item.scale ?? 1.0;
        const scale = Math.min(BW/size.x, BH/size.y, BD/size.z) * itemScale;
        m.scale.setScalar(scale);
        m.position.set(-center.x*scale, (-box.min.y)*scale, -center.z*scale);
        m.rotation.y = ci * 0.6;
        m.traverse(o => { if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });
        addToScene(m);
      }, null, () => {
        const mesh = new THREE.Mesh(
          new THREE.BoxGeometry(BW, BH, BD),
          new THREE.MeshStandardMaterial({ color:ITEM_COLORS[ci%ITEM_COLORS.length], roughness:0.55 })
        );
        mesh.castShadow=true; mesh.position.y=BH/2; addToScene(mesh);
      });
    } else {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(BW, BH, BD),
        new THREE.MeshStandardMaterial({ color:ITEM_COLORS[ci%ITEM_COLORS.length], roughness:0.55 })
      );
      mesh.castShadow=true; mesh.position.y=BH/2; addToScene(mesh);
    }
  });
}

let mixer=null, actions=[], animRunning=false;
let animNode=null;
const animNodeInitPos = new THREE.Vector3();
const animNodeCurPos  = new THREE.Vector3();

new GLTFLoader().load(CART_MODEL_URL, (gltf) => {
  const model = gltf.scene;
  const box    = new THREE.Box3().setFromObject(model);
  const size   = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const scale  = 2.4 / Math.max(size.x, size.y, size.z);
  model.scale.setScalar(scale);
  model.position.sub(center.multiplyScalar(scale));
  model.position.y += (size.y * scale) / 2;
  model.traverse(obj => {
    if (obj.isMesh) { obj.castShadow=true; obj.receiveShadow=true; }
    if (obj.name === 'Cylinder002') animNode = obj;
  });
  if (gltf.animations?.length) {
    mixer = new THREE.AnimationMixer(model);
    gltf.animations.forEach(clip => {
      const a = mixer.clipAction(clip);
      a.clampWhenFinished=true; a.loop=THREE.LoopOnce;
      a.play(); a.paused=true; actions.push(a);
    });
  }
  scene.add(model);
  model.updateMatrixWorld(true);
  if (animNode) {
    animNode.updateWorldMatrix(true, false);
    animNodeInitPos.setFromMatrixPosition(animNode.matrixWorld);
  }
  placeItems(model);
}, null, err => console.error('❌ cart.glb 載入失敗', err));

/* ── 結帳：寫入 Firebase Firestore ── */
const successMsg = document.getElementById('success-msg');

async function doCheckout(customerName) {
  animRunning = true;
  btnCheckout.disabled = true;

  if (actions.length > 0) {
    actions.forEach(a => { a.reset(); a.paused=false; a.play(); });
    const dur = Math.max(...actions.map(a => a.getClip().duration)) * 1000;
    setTimeout(showSuccess, dur);
  } else {
    setTimeout(showSuccess, 800);
  }

  const total = cartItems.reduce((s, i) => s + i.price * i.qty, 0);
  try {
    await addDoc(collection(db, 'orders'), {
      name:  customerName,
      items: cartItems.map(i => ({
        name:  i.name,
        emoji: i.emoji,
        qty:   i.qty,
        price: i.price,
      })),
      total,
      done: false,
      time: Timestamp.now(),
    });
  } catch(e) {
    console.error('❌ Firebase 寫入失敗', e);
  }
}

function showSuccess() {
  animRunning = false;
  successMsg.classList.add('show');
  localStorage.removeItem('cartItems');
  setTimeout(() => {
    successMsg.classList.remove('show');
    btnCheckout.disabled = false;
  }, 2500);
}

/* ── Render loop ── */
const clock  = new THREE.Clock();
const _delta = new THREE.Vector3();

(function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (mixer) mixer.update(dt);
  controls.update();
  if (animNode && itemGroups.length > 0) {
    animNode.updateWorldMatrix(true, false);
    animNodeCurPos.setFromMatrixPosition(animNode.matrixWorld);
    _delta.subVectors(animNodeCurPos, animNodeInitPos);
    itemGroups.forEach(({ group, initWorldPos }) => {
      group.position.x = initWorldPos.x + _delta.x;
      group.position.y += _delta.y;
      group.position.z = initWorldPos.z + _delta.z;
    });
  }
  renderer.render(scene, camera);
})();

window.addEventListener('resize', resize);
resize();

/* ── 背景音樂 CC0 · HoliznaCC0 ── */
(function(){
  const btn   = document.getElementById('music-btn');
  const label = document.getElementById('music-label');
  const audio = new Audio();
  audio.loop   = true;
  audio.volume = 0.35;
  audio.src = 'https://freemusicarchive.org/track/download/29551';

  let playing = false, labelTimer;

  function showLabel(ms) {
    label.classList.add('show');
    clearTimeout(labelTimer);
    labelTimer = setTimeout(() => label.classList.remove('show'), ms || 2800);
  }

  btn.addEventListener('click', () => {
    if (!playing) {
      audio.play().then(() => {
        playing = true;
        btn.textContent = '♬';
        btn.classList.add('playing');
        showLabel(3000);
      }).catch(() => {
        label.textContent = '⚠ 載入失敗，請確認網路連線';
        showLabel(2500);
      });
    } else {
      audio.pause();
      playing = false;
      btn.textContent = '♪';
      btn.classList.remove('playing');
    }
  });
})();
</script>
