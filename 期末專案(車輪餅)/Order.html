<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>訂單後台 — 海陸紅豆餅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{ --ink:#1a1a1a; --ink-3:#6b6b6b; --ink-4:#a0a0a0; --bg:#f5f4f1; --white:#fff; --border:rgba(0,0,0,0.09); }
*{ box-sizing:border-box; margin:0; padding:0; }
body{ font-family:'Noto Sans TC',sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; }

/* Login */
.login{ min-height:100vh; display:flex; align-items:center; justify-content:center; }
.card{ background:var(--white); border-radius:16px; padding:44px 38px; width:300px; box-shadow:0 6px 30px rgba(0,0,0,.08); }
.logo{ font-family:'Playfair Display',serif; font-size:20px; font-weight:700; text-align:center; margin-bottom:4px; }
.sub{ font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-4); text-align:center; margin-bottom:28px; }
.card label{ font-size:10px; letter-spacing:.15em; text-transform:uppercase; color:var(--ink-4); display:block; margin-bottom:6px; }
.card input{ width:100%; padding:11px 13px; border-radius:9px; border:1px solid rgba(0,0,0,.12); background:var(--bg); font-family:inherit; font-size:14px; margin-bottom:14px; outline:none; transition:border-color .2s; }
.card input:focus{ border-color:var(--ink-3); }
.btn-login{ width:100%; padding:12px; border-radius:9px; border:none; background:var(--ink); color:#fff; font-family:inherit; font-size:14px; font-weight:700; cursor:pointer; }
.btn-login:hover{ background:#3a3a3a; }
.err{ color:#c00; font-size:13px; margin-top:10px; text-align:center; display:none; }
.err.show{ display:block; }

/* Admin */
#admin{ display:none; }
.hd{ background:var(--white); border-bottom:1px solid var(--border); padding:14px 36px; display:flex; align-items:center; gap:14px; position:sticky; top:0; z-index:20; }
.hd-title{ font-family:'Playfair Display',serif; font-size:17px; font-weight:700; flex:1; }
.hd-title span{ font-size:11px; font-weight:400; color:var(--ink-4); margin-left:8px; letter-spacing:.14em; text-transform:uppercase; font-family:'Noto Sans TC',sans-serif; }
.hd-logout{ font-size:12px; color:var(--ink-4); text-decoration:none; padding:6px 14px; border-radius:50px; border:1px solid rgba(0,0,0,.12); cursor:pointer; background:transparent; font-family:inherit; transition:background .15s; }
.hd-logout:hover{ background:var(--bg); }
.main{ max-width:980px; margin:0 auto; padding:28px 20px; }
.stats{ display:flex; gap:14px; margin-bottom:28px; flex-wrap:wrap; }
.stat{ background:var(--white); border-radius:12px; padding:20px 24px; flex:1; min-width:130px; box-shadow:0 2px 8px rgba(0,0,0,.04); }
.stat-l{ font-size:10px; letter-spacing:.15em; text-transform:uppercase; color:var(--ink-4); margin-bottom:8px; }
.stat-n{ font-family:'Playfair Display',serif; font-size:30px; font-weight:700; line-height:1; }
.stat-u{ font-size:12px; color:var(--ink-4); margin-top:2px; }
.toolbar{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.sec{ font-family:'Playfair Display',serif; font-size:18px; font-weight:700; flex:1; }
.btn-del{ padding:9px 20px; border-radius:50px; border:1px solid rgba(200,0,0,.25); background:rgba(255,240,240,.8); color:#c00; font-family:inherit; font-size:13px; font-weight:500; cursor:pointer; transition:background .15s; }
.btn-del:hover:not(:disabled){ background:rgba(255,220,220,.9); }
.btn-del:disabled{ opacity:.35; cursor:not-allowed; }
.tbl-w{ background:var(--white); border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.04); overflow:auto; }
table{ width:100%; border-collapse:collapse; min-width:540px; }
thead th{ padding:11px 16px; text-align:left; font-size:10px; letter-spacing:.15em; text-transform:uppercase; color:var(--ink-4); border-bottom:1px solid var(--border); background:rgba(245,244,241,.6); white-space:nowrap; }
thead th:first-child{ width:48px; text-align:center; }
tbody tr{ border-bottom:1px solid var(--border); transition:opacity .2s; }
tbody tr:last-child{ border-bottom:none; }
tbody tr:hover{ background:rgba(245,244,241,.5); }
tbody tr.done-row{ opacity:.4; }
tbody tr.done-row .cname{ text-decoration:line-through; color:var(--ink-4); }
tbody td{ padding:12px 16px; font-size:13px; vertical-align:middle; }
tbody td:first-child{ text-align:center; }
.cb-btn{ width:22px; height:22px; border-radius:6px; border:1.5px solid rgba(0,0,0,.18); background:var(--white); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; transition:background .15s,border-color .15s; padding:0; }
.cb-btn:hover{ border-color:var(--ink-3); }
.cb-btn.checked{ background:var(--ink); border-color:var(--ink); }
.cb-btn.checked::after{ content:''; display:block; width:5px; height:9px; border:2px solid #fff; border-top:none; border-left:none; transform:rotate(45deg) translate(-1px,-1px); }
.ts{ font-size:12px; color:var(--ink-4); white-space:nowrap; }
.cname{ font-weight:600; }
.chips{ display:flex; flex-wrap:wrap; gap:5px; }
.chip{ display:inline-flex; align-items:center; gap:3px; background:var(--bg); border:1px solid var(--border); border-radius:50px; padding:2px 9px 2px 6px; font-size:12px; white-space:nowrap; }
.cq{ background:var(--ink); color:#fff; border-radius:50px; font-size:10px; font-weight:700; min-width:15px; height:15px; display:inline-flex; align-items:center; justify-content:center; padding:0 3px; }
.tot{ font-family:'Playfair Display',serif; font-size:15px; font-weight:700; white-space:nowrap; }
.empty{ text-align:center; padding:52px; color:var(--ink-4); }
.loading{ text-align:center; padding:52px; color:var(--ink-4); font-size:13px; }
</style>
</head>
<body>

<!-- 登入畫面 -->
<div id="login-screen" class="login">
  <div class="card">
    <div class="logo">海陸紅豆餅</div>
    <div class="sub">訂單後台</div>
    <label>密碼</label>
    <input type="password" id="pw-input" placeholder="••••••••" autocomplete="current-password">
    <button class="btn-login" id="btn-login">登入</button>
    <div class="err" id="err-msg">密碼錯誤</div>
  </div>
</div>

<!-- 後台主畫面 -->
<div id="admin">
  <div class="hd">
    <div class="hd-title">海陸紅豆餅 <span>Order Dashboard</span></div>
    <button class="hd-logout" id="btn-logout">登出</button>
  </div>
  <div class="main">
    <div class="stats">
      <div class="stat">
        <div class="stat-l">待處理</div>
        <div class="stat-n" id="stat-pending">—</div>
        <div class="stat-u">筆</div>
      </div>
      <div class="stat">
        <div class="stat-l">總訂單數</div>
        <div class="stat-n" id="stat-total">—</div>
        <div class="stat-u">筆</div>
      </div>
      <div class="stat">
        <div class="stat-l">累計營收</div>
        <div class="stat-n" id="stat-revenue">—</div>
        <div class="stat-u">新台幣</div>
      </div>
    </div>
    <div class="toolbar">
      <div class="sec">訂單紀錄</div>
      <button class="btn-del" id="btn-del" disabled>刪除已完成</button>
    </div>
    <div class="tbl-w">
      <div class="loading" id="tbl-loading">載入中…</div>
      <table id="tbl" style="display:none">
        <thead>
          <tr>
            <th>完成</th><th>時間</th><th>姓名</th><th>商品</th><th>合計</th>
          </tr>
        </thead>
        <tbody id="tbl-body"></tbody>
      </table>
      <div class="empty" id="tbl-empty" style="display:none">🧾 尚無訂單紀錄</div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp }    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy }
                            from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const ADMIN_PASS = 'hailuadmin';   // ← 與 cart.html 一致，可自行修改

const firebaseConfig = {
  apiKey:            "AIzaSyD1WeeJoIxdGz9lOpk9zBGIr4jR50OLREs",
  authDomain:        "hailua-orders.firebaseapp.com",
  projectId:         "hailua-orders",
  storageBucket:     "hailua-orders.firebasestorage.app",
  messagingSenderId: "747213229698",
  appId:             "1:747213229698:web:678e8eb1757c2fd30eae9b",
};
const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

/* ── 登入 ── */
const loginScreen = document.getElementById('login-screen');
const adminPanel  = document.getElementById('admin');
const pwInput     = document.getElementById('pw-input');
const errMsg      = document.getElementById('err-msg');
let   unsubscribe = null;

function doLogin() {
  if (pwInput.value === ADMIN_PASS) {
    loginScreen.style.display = 'none';
    adminPanel.style.display  = 'block';
    errMsg.classList.remove('show');
    startListening();
  } else {
    errMsg.classList.add('show');
    pwInput.value = '';
    pwInput.focus();
  }
}
document.getElementById('btn-login').addEventListener('click', doLogin);
pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

document.getElementById('btn-logout').addEventListener('click', () => {
  if (unsubscribe) { unsubscribe(); unsubscribe = null; }
  adminPanel.style.display  = 'none';
  loginScreen.style.display = 'flex';
  pwInput.value = '';
});

/* ── 即時監聽 Firestore ── */
function startListening() {
  const q = query(collection(db, 'orders'), orderBy('time', 'desc'));
  unsubscribe = onSnapshot(q, snap => {
    const orders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderOrders(orders);
  }, err => console.error(err));
}

/* ── 渲染訂單 ── */
function renderOrders(orders) {
  document.getElementById('tbl-loading').style.display = 'none';

  const pending = orders.filter(o => !o.done).length;
  const revenue = orders.reduce((s, o) => s + (o.total || 0), 0);
  const hasDone = orders.some(o => o.done);

  document.getElementById('stat-pending').textContent = pending;
  document.getElementById('stat-total').textContent   = orders.length;
  document.getElementById('stat-revenue').textContent = 'NT$' + revenue.toLocaleString();
  document.getElementById('btn-del').disabled = !hasDone;

  if (!orders.length) {
    document.getElementById('tbl').style.display      = 'none';
    document.getElementById('tbl-empty').style.display = 'block';
    return;
  }
  document.getElementById('tbl').style.display       = '';
  document.getElementById('tbl-empty').style.display = 'none';

  const tbody = document.getElementById('tbl-body');
  tbody.innerHTML = orders.map(o => {
    const done = !!o.done;
    const time = o.time?.toDate
      ? o.time.toDate().toLocaleString('zh-TW', {hour12:false})
      : (o.time || '—');
    const chips = (o.items || []).map(it =>
      `<span class="chip">${it.emoji || ''} ${it.name} <span class="cq">×${it.qty}</span></span>`
    ).join('');
    return `<tr class="${done ? 'done-row' : ''}" data-id="${o.id}">
      <td><button class="cb-btn ${done ? 'checked' : ''}" data-id="${o.id}" data-done="${done}"></button></td>
      <td><span class="ts">${time}</span></td>
      <td><span class="cname">${o.name || '匿名'}</span></td>
      <td><div class="chips">${chips}</div></td>
      <td><span class="tot">NT$${(o.total||0).toLocaleString()}</span></td>
    </tr>`;
  }).join('');

  /* 勾選按鈕 */
  tbody.querySelectorAll('.cb-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id   = btn.dataset.id;
      const done = btn.dataset.done === 'true';
      await updateDoc(doc(db, 'orders', id), { done: !done });
    });
  });
}

/* ── 刪除已完成 ── */
document.getElementById('btn-del').addEventListener('click', async () => {
  if (!confirm('確定刪除所有已完成的訂單？')) return;
  const q    = query(collection(db, 'orders'), orderBy('time', 'desc'));
  const snap = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js")
    .then(m => m.getDocs(q));
  const dels = snap.docs.filter(d => d.data().done);
  await Promise.all(dels.map(d => deleteDoc(doc(db, 'orders', d.id))));
});
</script>
</body>
</html>
